<body>

    <header>
        <h1>David Hernández Uribe</h1>

        <p class="subtitle">
            Assistant Professor | University of Illinois Chicago | Subduction, Economic geology, Earth and planetary evolution

        <nav>

    <main>

        <h2>Photos</h2>

        <p class="photo-intro">
            Fieldwork and places we've worked. Click any photo to see it larger.
        </p>

        <!--
            HOW TO ADD A PHOTO:
            1. Upload the photo into the folder  images/field/  in the repository.
            2. Copy one <figure> ... </figure> block below.
            3. Change the file name in BOTH places (src and data-full) and write your caption.
            Photos appear in the order they are listed here.
        -->
        <div class="gallery">

            <figure>
                <button type="button" data-full="../images/field/photo1.jpg">
                    <img src="../images/field/photo1.jpg" alt="Describe the photo here" loading="lazy">
                </button>
                <figcaption>Caption: place, year, and who is in the photo.</figcaption>
            </figure>

            <figure>
                <button type="button" data-full="../images/field/photo2.jpg">
                    <img src="../images/field/photo2.jpg" alt="Describe the photo here" loading="lazy">
                </button>
                <figcaption>Caption: place, year, and who is in the photo.</figcaption>
            </figure>

            <figure>
                <button type="button" data-full="../images/field/photo3.jpg">
                    <img src="../images/field/photo3.jpg" alt="Describe the photo here" loading="lazy">
                </button>
                <figcaption>Caption: place, year, and who is in the photo.</figcaption>
            </figure>

        </div>

    </main>

    <!-- Enlarged photo view (no need to edit this) -->
    <dialog class="lightbox" id="lightbox">
        <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
        <img src="" alt="">
        <p></p>
    </dialog>

    <script>
        const box = document.getElementById('lightbox');
        const boxImg = box.querySelector('img');
        const boxText = box.querySelector('p');

        document.querySelectorAll('.gallery button').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const fig = btn.closest('figure');
                boxImg.src = btn.dataset.full;
                boxImg.alt = btn.querySelector('img').alt;
                boxText.textContent = fig.querySelector('figcaption').textContent;
                box.showModal();
            });
        });

        box.querySelector('.lightbox-close').addEventListener('click', function () { box.close(); });
        box.addEventListener('click', function (e) { if (e.target === box) box.close(); });
    </script>

</body>

</html>
